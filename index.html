<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>leeorlandi / testrepo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #d4d4d4;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .terminal {
      width: 100%;
      max-width: 640px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      box-shadow: 0 0 0 1px #1a1a1a, 0 24px 64px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .titlebar {
      background: #1c1c1c;
      border-bottom: 1px solid #2a2a2a;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.red    { background: #ff5f57; }
    .dot.yellow { background: #febc2e; }
    .dot.green  { background: #28c840; }

    .tab-title {
      flex: 1;
      text-align: center;
      font-size: 11px;
      color: #555;
      letter-spacing: 0.05em;
    }

    .body {
      padding: 1.5rem 1.75rem 2rem;
      line-height: 1.75;
      font-size: 13.5px;
    }

    .line {
      display: flex;
      gap: 0.5rem;
      min-height: 1.75em;
    }

    .prompt {
      color: #7f85ff;
      user-select: none;
      flex-shrink: 0;
    }

    .cmd { color: #e5e5e5; }
    .out { color: #8a8a8a; padding-left: 1.25rem; }
    .hello { color: #a8ff78; font-weight: 600; letter-spacing: 0.02em; }
    .dim { color: #3a3a3a; }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: #7f85ff;
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .spacer { height: 0.5rem; }
    .spacer-lg { height: 1rem; }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="tab-title">leeorlandi — testrepo</span>
    </div>
    <div class="body">
      <div class="line">
        <span class="prompt">$</span>
        <span class="cmd">cd ~/testrepo &amp;&amp; git log --oneline -3</span>
      </div>
      <div class="line out dim">7f3a1b2 trolled again</div>
      <div class="line out dim">c0ffee9 this is a readme doc</div>
      <div class="line out dim">deadb33f initial commit</div>

      <div class="spacer-lg"></div>

      <div class="line">
        <span class="prompt">$</span>
        <span class="cmd">echo "hello, world"</span>
      </div>
      <div class="line out hello">hello, world.</div>

      <div class="spacer"></div>

      <div class="line out" style="color:#555; font-size:12px;">
        &nbsp;&nbsp;# still here. still tinkering.
      </div>

      <div class="spacer-lg"></div>

      <div class="line">
        <span class="prompt">$</span>
        <span class="cursor"></span>
      </div>
    </div>
  </div>
</body>
</html>
